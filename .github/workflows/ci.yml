# Typecheck + tests on every pull request and every push to main — the same
# two commands AGENTS.md names as the verification suite. The full suite is
# expected green: as of 2026-08-19 there are no tolerated failures, so any
# red here is a real regression (or a test left pinning copy that changed —
# update the pin in the same PR that changes the copy).
name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

  image:
    name: Publish Monifactory image
    needs: test
    if: github.repository == 'vrrdnt/monifactory-factory-flow' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/vrrdnt/monifactory-factory-flow:latest
            ghcr.io/vrrdnt/monifactory-factory-flow:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Redeploy planner in Portainer
        if: env.PORTAINER_WEBHOOK_URL != ''
        run: |
          status="$(curl --silent --show-error --fail \
            --connect-timeout 10 --max-time 180 \
            --request POST --output /dev/null --write-out '%{http_code}' \
            "$PORTAINER_WEBHOOK_URL")"
          case "$status" in
            2??) echo "Portainer accepted the planner update." ;;
            *) echo "Portainer returned HTTP $status; expected a successful webhook response."; exit 1 ;;
          esac
