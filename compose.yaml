services:
  planner:
    image: ghcr.io/vrrdnt/monifactory-factory-flow:${PLANNER_TAG:-latest}
    build:
      context: .
      args:
        NEXT_PUBLIC_BASE_PATH: /moni-planner
        NEXT_PUBLIC_SITE_URL: https://vrrdnt.dev
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8580:3000"
